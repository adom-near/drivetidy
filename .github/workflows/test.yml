name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fd (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fd-find && sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install fd (macOS)
        if: runner.os == 'macOS'
        run: brew install fd

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Run tests
        run: pytest -v
