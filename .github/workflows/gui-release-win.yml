name: gui-release-win

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build binary with PyInstaller
        run: pyinstaller --clean --noconfirm drivetidy.spec

      - name: Package as zip
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path drivetidy.exe -DestinationPath drivetidy-windows-x64.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/drivetidy-windows-x64.zip
          generate_release_notes: true
